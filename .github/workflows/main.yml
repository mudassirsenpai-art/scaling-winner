name: Run Jazz Telegram Bot

on:
  workflow_dispatch:        # Actions tab se manually "Run workflow" dabao

concurrency:
  group: telegram-bot
  cancel-in-progress: true  # naya run aaye to purana band

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GitHub ka limit 6 ghante hai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: database.json (sessions/allowed users) pehle se save rakhna ho to
      - name: Restore database (optional)
        env:
          DATABASE_JSON: ${{ secrets.DATABASE_JSON }}
        run: |
          if [ -n "$DATABASE_JSON" ]; then
            echo "$DATABASE_JSON" > database.json
            echo "database.json restored"
          else
            echo "No DATABASE_JSON secret - fresh start"
          fi

      - name: Start bot (with logging)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PORT: "8080"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          # live logs Actions page pe bhi dikhenge, aur bot.log me bhi save honge
          python -X faulthandler -u bot.py 2>&1 | tee bot.log

      # Neeche ke steps bot band hone, crash, cancel ya timeout, har case me chalte hain
      - name: Error summary
        if: always()
        run: |
          {
            echo "## Bot log summary"
            echo "Total lines: $(wc -l < bot.log 2>/dev/null || echo 0)"
            echo
            echo "### Errors / warnings (last 60)"
            echo '```'
            grep -n -i -E "error|exception|traceback|critical|failed|❌|💔|⚠️" bot.log 2>/dev/null | tail -60 || true
            echo '```'
            echo
            echo "### Last 40 lines"
            echo '```'
            tail -40 bot.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_number }}
          path: |
            bot.log
          if-no-files-found: ignore
          retention-days: 7
