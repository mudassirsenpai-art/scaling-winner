name: Run Jazz Telegram Bot

on:
  workflow_dispatch:        # Actions tab se manually "Run workflow" dabao

concurrency:
  group: telegram-bot
  cancel-in-progress: true  # naya run aaye to purana band

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # GitHub ka limit 6 ghante hai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: database.json (sessions/allowed users) pehle se save rakhna ho to
      - name: Restore database (optional)
        env:
          DATABASE_JSON: ${{ secrets.DATABASE_JSON }}
        run: |
          if [ -n "$DATABASE_JSON" ]; then
            echo "$DATABASE_JSON" > database.json
            echo "database.json restored"
          else
            echo "No DATABASE_JSON secret - fresh start"
          fi

      - name: Start bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PORT: "8080"
        run: python bot.py
